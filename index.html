<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YourTube</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --surface-2: #242424;
      --text: #f1f1f1;
      --muted: #aaaaaa;
      --accent: #ff0033;
      --border: #2e2e2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; }
    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(15, 15, 15, 0.96); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border); padding: 10px 14px;
    }
    .top-row { display: flex; align-items: center; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.15rem; cursor: pointer; flex-shrink: 0; }
    .brand-logo {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, #ff2a55, #ff7b00);
      display: grid; place-items: center; font-size: 0.9rem; font-weight: 800; color: #fff;
    }
    .search-wrap { flex: 1; display: flex; gap: 6px; }
    .search-wrap input {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); padding: 8px 12px; border-radius: 20px; font-size: 0.92rem; outline: none;
    }
    .search-wrap input:focus { border-color: #666; }
    .nav-tabs {
      display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--surface-2); color: var(--text); border: none;
      padding: 7px 14px; border-radius: 18px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .tab-btn.active { background: var(--text); color: #0f0f0f; }
    .chips {
      display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px 4px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 5px 12px; border-radius: 14px; font-size: 0.78rem; cursor: pointer; white-space: nowrap;
    }
    .chip.active { background: #2c2c2c; color: var(--text); border-color: #555; }
    .section-title { padding: 12px 14px 6px; font-size: 0.95rem; font-weight: 700; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
    .reset-link { font-size: 0.75rem; color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px; padding: 8px 14px;
    }
    .shorts-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 12px; padding: 8px 14px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; cursor: pointer; transition: transform 0.15s ease;
    }
    .card:hover { transform: translateY(-2px); }
    .thumb-box {
      position: relative; aspect-ratio: 16 / 9; background: #121212; overflow: hidden;
    }
    .shorts-grid .thumb-box { aspect-ratio: 9 / 14; }
    .thumb-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge {
      position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.82);
      color: #fff; font-size: 0.72rem; padding: 2px 6px; border-radius: 6px; font-weight: 600;
    }
    .badge.live { background: var(--accent); }
    .card-body { padding: 10px 12px 12px; }
    .title { font-size: 0.9rem; font-weight: 600; line-height: 1.35; margin-bottom: 4px; }
    .meta { font-size: 0.76rem; color: var(--muted); }
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 50;
      display: none; flex-direction: column; justify-content: center; padding: 14px;
    }
    .modal.open { display: flex; }
    .player-box {
      width: 100%; max-width: 820px; margin: 0 auto; background: #141414;
      border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    }
    .player-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; border-bottom: 1px solid var(--border);
    }
    .close-btn {
      background: var(--surface-2); color: var(--text); border: none;
      padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    .frame-wrap { position: relative; aspect-ratio: 16 / 9; background: #000; }
    .frame-wrap iframe { width: 100%; height: 100%; border: 0; }
    .player-info { padding: 12px 14px; }
    .yt-fallback {
      display: inline-block; margin-top: 8px; color: #ff5c77; font-size: 0.82rem; text-decoration: none;
    }
    .empty { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <div class="top-row">
      <div class="brand" onclick="setTab('home')">
        <div class="brand-logo">▶</div>
        <span>YourTube</span>
      </div>
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="Search GTA 6, Total Gaming, Bigg Boss, TMKOC, Live..." oninput="render()" />
      </div>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" data-tab="home" onclick="setTab('home')">Home</button>
      <button class="tab-btn" data-tab="shorts" onclick="setTab('shorts')">Shorts</button>
      <button class="tab-btn" data-tab="live" onclick="setTab('live')">Live</button>
      <button class="tab-btn" data-tab="kids" onclick="setTab('kids')">Kids</button>
    </div>
  </header>

  <div class="chips" id="chipsRow"></div>

  <div class="section-title">
    <span id="sectionHeading">For You (Smart Home Feed)</span>
    <button class="reset-link" onclick="resetPrefs()">Reset Feed</button>
  </div>

  <div id="feedContainer" class="grid"></div>

  <div id="playerModal" class="modal" onclick="if(event.target===this) closePlayer()">
    <div class="player-box">
      <div class="player-top">
        <strong id="playerTitle" style="font-size:0.92rem;"></strong>
        <button class="close-btn" onclick="closePlayer()">Close ✕</button>
      </div>
      <div class="frame-wrap">
        <iframe id="ytFrame" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="player-info">
        <div id="playerMeta" class="meta"></div>
        <a id="ytDirectLink" class="yt-fallback" target="_blank" rel="noopener">Open on YouTube if embed is restricted ↗</a>
      </div>
    </div>
  </div>

  <script>
    const VIDEOS = [
      { id: "v1", ytId: "QdBZY2fkU-0", title: "Grand Theft Auto VI Trailer 1", channel: "Rockstar Games", topic: "GTA 6", kind: "video", duration: "1:31" },
      { id: "v2", ytId: "hY7m5jjJ9mM", title: "Live Stream Showcase & Gameplay Highlights", channel: "Live Hub", topic: "Live", kind: "live", duration: "LIVE" },
      { id: "v3", ytId: "5qap5aO4i9A", title: "Nonstop Beats & Chill Stream", channel: "Lofi Girl", topic: "Live", kind: "live", duration: "LIVE" },
      { id: "v4", ytId: "tgbNymZ7vqY", title: "Funny Moments & Classic Comedy Clip", channel: "Comedy Clips", topic: "TMKOC", kind: "video", duration: "3:44" },
      { id: "v5", ytId: "aqz-KE-bpKQ", title: "Big Buck Bunny 60fps Showcase", channel: "Blender", topic: "Tech & Creators", kind: "video", duration: "10:34" },
      { id: "v6", ytId: "jNQXAC9IVRw", title: "Me at the zoo — First YouTube Video", channel: "jawed", topic: "Tech & Creators", kind: "video", duration: "0:19" },
      { id: "s1", ytId: "jNQXAC9IVRw", title: "Quick Short #1 — Classic Clip", channel: "Shorts Feed", topic: "Shorts", kind: "short", duration: "Short" },
      { id: "s2", ytId: "tgbNymZ7vqY", title: "Quick Short #2 — Fun Beat", channel: "Shorts Feed", topic: "Shorts", kind: "short", duration: "Short" },
      { id: "s3", ytId: "QdBZY2fkU-0", title: "Quick Short #3 — GTA 6 Scene", channel: "Shorts Feed", topic: "GTA 6", kind: "short", duration: "Short" },
      { id: "k1", ytId: "aqz-KE-bpKQ", title: "Kids Animated Adventure Story", channel: "Kids Corner", topic: "Kids", kind: "kids", duration: "10:34" },
      { id: "k2", ytId: "tgbNymZ7vqY", title: "Kids Music & Fun Rhymes", channel: "Kids Corner", topic: "Kids", kind: "kids", duration: "3:44" }
    ];

    const TOPICS = ["All", "GTA 6", "Total Gaming", "Bigg Boss", "TMKOC", "Mr. Indian Hacker", "Live", "Tech & Creators"];
    const PREF_KEY = "yourtube_topic_scores_v1";
    let activeTab = "home";
    let activeTopic = "All";

    function getScores() {
      try { return JSON.parse(localStorage.getItem(PREF_KEY) || "{}"); }
      catch { return {}; }
    }

    function bumpTopic(topic) {
      if (!topic) return;
      const scores = getScores();
      scores[topic] = (scores[topic] || 0) + 1;
      localStorage.setItem(PREF_KEY, JSON.stringify(scores));
    }

    function resetPrefs() {
      localStorage.removeItem(PREF_KEY);
      activeTopic = "All";
      renderChips();
      render();
    }

    function setTab(tab) {
      activeTab = tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      const headings = {
        home: "For You (Smart Home Feed)",
        shorts: "Shorts",
        live: "Live Streams",
        kids: "Kids Zone"
      };
      document.getElementById("sectionHeading").textContent = headings[tab] || "YourTube";
      render();
    }

    function renderChips() {
      const row = document.getElementById("chipsRow");
      row.innerHTML = "";
      TOPICS.forEach(t => {
        const btn = document.createElement("button");
        btn.className = "chip" + (activeTopic === t ? " active" : "");
        btn.textContent = t;
        btn.onclick = () => {
          activeTopic = t;
          if (t !== "All") bumpTopic(t);
          renderChips();
          render();
        };
        row.appendChild(btn);
      });
    }

    function rankItems(items) {
      const scores = getScores();
      return [...items].sort((a, b) => (scores[b.topic] || 0) - (scores[a.topic] || 0));
    }

    function render() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const container = document.getElementById("feedContainer");
      container.className = activeTab === "shorts" ? "shorts-grid" : "grid";

      let list = VIDEOS.filter(v => {
        if (q) {
          return (
            v.title.toLowerCase().includes(q) ||
            v.channel.toLowerCase().includes(q) ||
            v.topic.toLowerCase().includes(q)
          );
        }
        if (activeTab === "kids") return v.kind === "kids";
        if (activeTab === "shorts") return v.kind === "short";
        if (activeTab === "live") return v.kind === "live";
        return v.kind !== "kids";
      });

      if (!q && activeTopic !== "All" && activeTab === "home") {
        list = list.filter(v => v.topic.toLowerCase() === activeTopic.toLowerCase() || v.title.toLowerCase().includes(activeTopic.toLowerCase()));
      }

      list = rankItems(list);

      if (!list.length) {
        container.innerHTML = `<div class="empty" style="grid-column:1/-1;">No matching items found. Try another keyword or switch tabs.</div>`;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="card" onclick="openVideo('${item.id}')">
          <div class="thumb-box">
            <img src="https://i.ytimg.com/vi/${item.ytId}/hqdefault.jpg" alt="${item.title}" loading="lazy" />
            <span class="badge ${item.kind === "live" ? "live" : ""}">${item.duration}</span>
          </div>
          <div class="card-body">
            <div class="title">${item.title}</div>
            <div class="meta">${item.channel} • ${item.topic}</div>
          </div>
        </div>
      `).join("");
    }

    function openVideo(id) {
      const item = VIDEOS.find(v => v.id === id);
      if (!item) return;
      bumpTopic(item.topic);
      document.getElementById("playerTitle").textContent = item.title;
      document.getElementById("playerMeta").textContent = `${item.channel} • ${item.topic}`;
      document.getElementById("ytFrame").src = `https://www.youtube.com/embed/${item.ytId}?autoplay=1&rel=0`;
      document.getElementById("ytDirectLink").href = `https://www.youtube.com/watch?v=${item.ytId}`;
      document.getElementById("playerModal").classList.add("open");
      render();
    }

    function closePlayer() {
      document.getElementById("playerModal").classList.remove("open");
      document.getElementById("ytFrame").src = "";
    }

    renderChips();
    render();
  </script>

<!-- RK-ADMOB-BRIDGE -->
<script>
  window.RKAdMob = {
    showBanner: function(placement) {
      try {
        if (window.AndroidAdMob && typeof window.AndroidAdMob.showBanner === "function") {
          window.AndroidAdMob.showBanner(placement || "yourtube_bottom");
        }
      } catch (e) {}
    },
    showInterstitial: function(placement) {
      try {
        if (window.AndroidAdMob && typeof window.AndroidAdMob.showInterstitial === "function") {
          window.AndroidAdMob.showInterstitial(placement || "yourtube_interstitial");
        }
      } catch (e) {}
    }
  };
  window.addEventListener("DOMContentLoaded", function() {
    window.RKAdMob.showBanner("yourtube_home");
  });
</script>

</body>
</html>
