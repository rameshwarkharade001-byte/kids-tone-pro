<!DOCTYPE html>
<html lang="mr">
<head>
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kids Tone - YouTube Kids Edition</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Fredoka (Playful Kids Font) & Nunito -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Vector Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --yt-red: #FF0033;
      --yt-yellow: #FFB800;
      --yt-blue: #00A8FF;
      --yt-green: #00C853;
      --bg-cream: #F4F7FC;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-cream);
      background-image:
        radial-gradient(circle at 8% 8%, rgba(255, 184, 0, 0.14) 0%, transparent 35%),
        radial-gradient(circle at 92% 15%, rgba(0, 168, 255, 0.14) 0%, transparent 35%),
        radial-gradient(circle at 50% 90%, rgba(255, 0, 51, 0.08) 0%, transparent 45%);
      color: #1E293B;
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    .kids-font {
      font-family: 'Fredoka', sans-serif;
    }

    .yt-card {
      background: #FFFFFF;
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
      border: 2px solid #FFFFFF;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .yt-card:active {
      transform: scale(0.96);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .tab-pill-active {
      background: #FF0033;
      color: #FFFFFF;
      box-shadow: 0 6px 16px rgba(255, 0, 51, 0.35);
      transform: translateY(-2px);
    }

    .skeleton-pulse {
      background: linear-gradient(90deg, #E2E8F0 25%, #F1F5F9 50%, #E2E8F0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
<style id="cleanNativeYTStyle">
  .yt-native-landscape {
    position: fixed !important;
    top: 50% !important;
    left: 50% !important;
    width: 100vh !important;
    height: 100vw !important;
    max-width: none !important;
    transform: translate(-50%, -50%) rotate(90deg) !important;
    z-index: 999999 !important;
    background: #000 !important;
  }
  @media (orientation: landscape) {
    .yt-native-landscape {
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      transform: none !important;
    }
  }
</style>
<script id="cleanNativeYTScript">
  function onNativeYTFullscreenOnly() {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    const iframe = document.getElementById('ytKidsIframeTarget');
    const box = document.getElementById('kidsVideoWrapper') || document.getElementById('kidsVideoBox') || (iframe && iframe.parentElement);
    if (!box) return;
    if (fsEl) {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      box.classList.add('yt-native-landscape');
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    }
  }
  document.addEventListener('fullscreenchange', onNativeYTFullscreenOnly);
  document.addEventListener('webkitfullscreenchange', onNativeYTFullscreenOnly);
</script>
</head>
<body>

  <!-- YOUTUBE KIDS STYLE TOP HEADER -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-3 shadow-sm border-b border-slate-100">
    <div class="flex items-center justify-between max-w-5xl mx-auto">
      <!-- Brand Logo -->
      <div class="flex items-center gap-2.5" onclick="resetToHome()">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-red-500 via-rose-500 to-amber-500 flex items-center justify-center shadow-md shadow-red-500/30 rotate-[-3deg]">
          <i data-lucide="play" class="w-6 h-6 text-white fill-white ml-0.5"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="kids-font text-2xl font-bold text-slate-900 tracking-tight">Kids Tone</h1>
            <span class="px-2 py-0.5 rounded-lg bg-amber-400 text-slate-950 kids-font text-[10px] font-bold uppercase">KIDS</span>
          </div>
          <p class="text-[11px] font-bold text-slate-400 -mt-1">Safe Cartoons & Learning</p>
        </div>
      </div>

      <!-- Age Profile & Search Buttons -->
      <div class="flex items-center gap-2">
        <!-- Timer Pill -->
        <div id="timerBadge" class="hidden px-3 py-1.5 rounded-full bg-amber-100 border border-amber-300 text-amber-800 text-xs font-extrabold flex items-center gap-1">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-amber-600"></i>
          <span id="timerDisplay">30:00</span>
        </div>

        <!-- Age Group Pill -->
        <button onclick="cycleAgeProfile()" id="ageProfileBtn" class="px-3 py-1.5 rounded-full bg-sky-100 text-sky-700 border border-sky-200 kids-font text-xs font-bold flex items-center gap-1 shadow-sm active:scale-95 transition">
          <i data-lucide="smile" class="w-4 h-4 text-sky-500"></i>
          <span id="ageLabel">All Ages</span>
        </button>

        <!-- Search Icon -->
        <button onclick="playPop(); toggleSearchDrawer()" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-700 active:scale-90 transition">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- EXPANDABLE SEARCH INPUT -->
    <div id="searchDrawer" class="hidden max-w-5xl mx-auto pt-3">
      <form onsubmit="handleLiveSearch(event)" class="relative flex gap-2">
        <div class="relative flex-1">
          <input
            type="text"
            id="liveSearchInput"
            placeholder="मोटू पतलू, छोटा भीम, ऑगी, चिकी चुम शोधा..."
            class="w-full bg-slate-100 border-2 border-sky-300 rounded-2xl py-2.5 pl-10 pr-4 text-sm font-bold text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-red-400"
          />
          <i data-lucide="search" class="w-4 h-4 text-sky-500 absolute left-3.5 top-3.5"></i>
        </div>
        <button type="submit" class="px-4 py-2.5 rounded-2xl bg-red-500 text-white kids-font text-sm font-bold shadow-md shadow-red-500/25 active:scale-95">
          Go
        </button>
      </form>
    </div>

    <!-- YOUTUBE KIDS CATEGORY TABS (No Shorts!) -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pt-3 max-w-5xl mx-auto">
      <button onclick="switchMainSection('shows', this)" class="main-tab tab-pill-active px-4 py-2 rounded-full kids-font text-sm font-semibold flex items-center gap-1.5 shrink-0 transition">
        <i data-lucide="tv" class="w-4 h-4"></i>
        <span>Shows</span>
      </button>

      <button onclick="switchMainSection('music', this)" class="main-tab bg-slate-100 text-slate-600 px-4 py-2 rounded-full kids-font text-sm font-semibold flex items-center gap-1.5 shrink-0 transition">
        <i data-lucide="music" class="w-4 h-4 text-pink-500"></i>
        <span>Music & Rhymes</span>
      </button>

      <button onclick="switchMainSection('explore', this)" class="main-tab bg-slate-100 text-slate-600 px-4 py-2 rounded-full kids-font text-sm font-semibold flex items-center gap-1.5 shrink-0 transition">
        <i data-lucide="compass" class="w-4 h-4 text-emerald-500"></i>
        <span>Explore & Learn</span>
      </button>

      <button onclick="switchMainSection('parents', this)" class="main-tab bg-slate-100 text-slate-600 px-4 py-2 rounded-full kids-font text-sm font-semibold flex items-center gap-1.5 shrink-0 transition">
        <i data-lucide="lock" class="w-4 h-4 text-amber-500"></i>
        <span>Parents</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main class="max-w-5xl mx-auto">
    <section id="section-shows" class="content-section block"></section>
    <section id="section-music" class="content-section hidden"></section>
    <section id="section-explore" class="content-section hidden"></section>
    <section id="section-parents" class="content-section hidden"></section>
  </main>

  <!-- PART 2 CORE SCRIPT: Audio, Age Profiles & Navigation -->
  <script>
    lucide.createIcons();

    // Playful Bubble Pop Sound (Web Audio API)
    const popCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playPop() {
      if (popCtx.state === 'suspended') popCtx.resume();
      const osc = popCtx.createOscillator();
      const gain = popCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(580, popCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(980, popCtx.currentTime + 0.07);
      gain.gain.setValueAtTime(0.1, popCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, popCtx.currentTime + 0.07);
      osc.connect(gain);
      gain.connect(popCtx.destination);
      osc.start();
      osc.stop(popCtx.currentTime + 0.08);
    }

    // Age Profiles (Just like YouTube Kids: Preschool, Younger, Older)
    const ageModes = [
      { id: 'all', label: 'All Ages', queryBoost: '' },
      { id: 'preschool', label: 'Preschool (2-4)', queryBoost: 'nursery rhymes chiki chum' },
      { id: 'younger', label: 'Younger (5-8)', queryBoost: 'motu patlu chhota bheem oggy' },
      { id: 'older', label: 'Older (9-12)', queryBoost: 'vir robot boy gattu battu taarak mehta' }
    ];
    let currentAgeIdx = 0;

    function cycleAgeProfile() {
      playPop();
      currentAgeIdx = (currentAgeIdx + 1) % ageModes.length;
      const mode = ageModes[currentAgeIdx];
      document.getElementById('ageLabel').innerText = mode.label;
      if (typeof loadLiveCartoons === 'function') {
        loadLiveCartoons(mode.id === 'all' ? 'all' : mode.queryBoost, mode.id !== 'all');
      }
    }

    function toggleSearchDrawer() {
      const drawer = document.getElementById('searchDrawer');
      drawer.classList.toggle('hidden');
      if (!drawer.classList.contains('hidden')) {
        document.getElementById('liveSearchInput').focus();
      }
    }

    function switchMainSection(secName, btn) {
      playPop();
      document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
      document.getElementById('section-' + secName).classList.remove('hidden');

      document.querySelectorAll('.main-tab').forEach(t => {
        t.classList.remove('tab-pill-active');
        t.classList.add('bg-slate-100', 'text-slate-600');
      });
      btn.classList.add('tab-pill-active');
      btn.classList.remove('bg-slate-100', 'text-slate-600');

      if (secName === 'music' && typeof loadMusicSection === 'function') loadMusicSection();
      if (secName === 'explore' && typeof loadExploreSection === 'function') loadExploreSection();
      if (secName === 'parents' && typeof renderParentsZone === 'function') renderParentsZone();
    }

    function resetToHome() {
      playPop();
      const firstTab = document.querySelector('.main-tab');
      switchMainSection('shows', firstTab);
      if (typeof selectShowCharacter === 'function') selectShowCharacter('all');
    }
  </script>

  <!-- PART 3: LIVE YOUTUBE KIDS SERVER FEED & CHARACTER ENGINE -->
  <script>
    const showsCharacters = [
      { id: 'all', name: 'All Shows', bg: 'from-red-500 to-amber-500', code: 'ALL' },
      { id: 'motu', name: 'Motu Patlu', bg: 'from-amber-400 to-orange-600', code: 'MP' },
      { id: 'bheem', name: 'Chhota Bheem', bg: 'from-orange-500 to-red-600', code: 'CB' },
      { id: 'oggy', name: 'Oggy', bg: 'from-sky-400 to-blue-600', code: 'OG' },
      { id: 'vir', name: 'Vir Robot Boy', bg: 'from-rose-500 to-pink-600', code: 'VR' },
      { id: 'gattu', name: 'Gattu Battu', bg: 'from-emerald-400 to-teal-600', code: 'GB' },
      { id: 'pakdam', name: 'Pakdam Pakdai', bg: 'from-purple-500 to-indigo-600', code: 'PP' },
      { id: 'shinchan', name: 'Shinchan', bg: 'from-red-500 to-yellow-500', code: 'SC' },
      { id: 'taarak', name: 'Taarak Mehta', bg: 'from-yellow-400 to-amber-600', code: 'TM' }
    ];

    let selectedShow = 'all';
    let currentFetchedList = [];

    // Render Loading Skeletons while Server Fetches Live YouTube Videos
    function getSkeletonCards() {
      return Array(6).fill(0).map(() => `
        <div class="yt-card overflow-hidden p-2.5">
          <div class="w-full aspect-video rounded-2xl skeleton-pulse"></div>
          <div class="h-4 w-3/4 rounded-lg skeleton-pulse mt-3"></div>
          <div class="h-3 w-1/3 rounded-lg skeleton-pulse mt-2"></div>
        </div>
      `).join('');
    }

    // Build Video Cards Grid (Official YouTube Kids Style)
    function buildYtKidsGrid(videos, badgeText) {
      if (!videos || videos.length === 0) {
        return `<div class="yt-card p-8 text-center text-slate-500 font-bold">व्हिडिओ लोड होत आहेत किंवा इंटरनेट तपासा...</div>`;
      }

      return `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
          ${videos.map(v => `
            <div onclick="launchKidsPlayer('${v.ytId}', '${v.title.replace(/'/g, "\\'")}', '${badgeText}')" class="yt-card overflow-hidden cursor-pointer group">
              <div class="relative aspect-video bg-slate-200 overflow-hidden">
                <img 
                  src="https://i.ytimg.com/vi/${v.ytId}/hqdefault.jpg" 
                  alt="${v.title}" 
                  class="w-full h-full object-cover group-hover:scale-105 transition duration-300" 
                  loading="lazy"
                />
                <span class="absolute bottom-2.5 right-2.5 bg-slate-900/85 text-white text-[11px] font-extrabold px-2.5 py-0.5 rounded-lg">
                  ${v.duration || 'HD'}
                </span>
                <div class="absolute inset-0 flex items-center justify-center bg-black/10 group-hover:bg-black/20 transition">
                  <div class="w-14 h-14 rounded-full bg-red-600/95 flex items-center justify-center shadow-xl border-2 border-white">
                    <i data-lucide="play" class="w-7 h-7 text-white fill-white ml-0.5"></i>
                  </div>
                </div>
              </div>
              <div class="p-3.5">
                <div class="flex items-center gap-1.5 mb-1">
                  <span class="px-2 py-0.5 rounded-md bg-sky-100 text-sky-700 text-[10px] font-extrabold uppercase tracking-wide">
                    ${badgeText}
                  </span>
                  <span class="text-[10px] font-bold text-emerald-600 flex items-center gap-0.5">
                    <i data-lucide="check-circle-2" class="w-3 h-3"></i> Kids Safe
                  </span>
                </div>
                <h3 class="kids-font text-base font-semibold text-slate-800 line-clamp-2 leading-snug">
                  ${v.title}
                </h3>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // Fetch Live Videos from Python Flask Server (/api/videos)
    async function loadLiveCartoons(param, isCustomQuery = false) {
      const showsEl = document.getElementById('section-shows');

      // Render Character Bubbles Row
      let bubblesHtml = `
        <div class="px-4 pt-4">
          <div class="flex gap-3.5 overflow-x-auto no-scrollbar pb-2">
            ${showsCharacters.map(c => {
              const active = !isCustomQuery && selectedShow === c.id;
              return `
                <button onclick="selectShowCharacter('${c.id}')" class="flex flex-col items-center shrink-0 active:scale-90 transition">
                  <div class="w-16 h-16 rounded-full p-1 bg-gradient-to-tr ${c.bg} ${active ? 'ring-4 ring-red-500 scale-105' : 'opacity-90'} shadow-md">
                    <div class="w-full h-full rounded-full bg-white flex items-center justify-center">
                      <span class="kids-font font-bold text-lg bg-gradient-to-tr ${c.bg} bg-clip-text text-transparent">${c.code}</span>
                    </div>
                  </div>
                  <span class="text-xs mt-1.5 font-extrabold ${active ? 'text-red-600' : 'text-slate-600'}">${c.name}</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;

      const headingTitle = isCustomQuery
        ? `Results for "${param}"`
        : (showsCharacters.find(x => x.id === selectedShow)?.name || 'All Cartoon Shows');

      showsEl.innerHTML = bubblesHtml + `
        <div class="px-4 pt-3">
          <div class="flex items-center justify-between mb-3">
            <h2 class="kids-font text-xl font-bold text-slate-800">${headingTitle}</h2>
            <span class="text-xs font-extrabold text-sky-600 bg-sky-100 px-3 py-1 rounded-full">Live YouTube Kids</span>
          </div>
          <div id="showsGridTarget">${getSkeletonCards()}</div>
        </div>
      `;
      lucide.createIcons();

      try {
        const apiUrl = isCustomQuery
          ? `/api/videos?q=${encodeURIComponent(param)}`
          : `/api/videos?category=${encodeURIComponent(param)}`;
        const res = await fetch(apiUrl);
        const data = await res.json();
        currentFetchedList = data.videos || [];
        document.getElementById('showsGridTarget').innerHTML = buildYtKidsGrid(
          currentFetchedList,
          isCustomQuery ? 'Kids Search' : headingTitle
        );
        lucide.createIcons();
      } catch (err) {
        document.getElementById('showsGridTarget').innerHTML = `
          <div class="yt-card p-6 text-center text-rose-600 font-bold">
            सर्व्हर कनेक्ट होत आहे... कृपया <code>python server.py</code> चालू असल्याची खात्री करा.
          </div>
        `;
      }
    }

    function selectShowCharacter(catId) {
      playPop();
      selectedShow = catId;
      loadLiveCartoons(catId, false);
    }

    function handleLiveSearch(e) {
      e.preventDefault();
      const q = document.getElementById('liveSearchInput').value.trim();
      if (!q) return;
      playPop();
      const firstTab = document.querySelector('.main-tab');
      switchMainSection('shows', firstTab);
      loadLiveCartoons(q, true);
    }

    // Load Music & Rhymes Tab (Chiki Chum, ChuChu TV, Hindi Nursery Rhymes)
    async function loadMusicSection() {
      const musicEl = document.getElementById('section-music');
      musicEl.innerHTML = `
        <div class="px-4 pt-4">
          <div class="rounded-3xl p-5 mb-5 bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 text-white shadow-lg">
            <h2 class="kids-font text-2xl font-bold">Chiki Chum & Kids Rhymes</h2>
            <p class="text-xs font-bold text-white/90 mt-0.5">लहान मुलांसाठी बडबडगीते, ABC गाणी आणि डान्स व्हिडिओ</p>
          </div>
          <div id="musicGridTarget">${getSkeletonCards()}</div>
        </div>
      `;
      lucide.createIcons();

      const res = await fetch('/api/videos?category=rhymes');
      const data = await res.json();
      currentFetchedList = data.videos || [];
      document.getElementById('musicGridTarget').innerHTML = buildYtKidsGrid(currentFetchedList, 'Kids Rhymes');
      lucide.createIcons();
    }

    // Load Explore & Learn Tab (Moral Stories, Science & Craft for Kids)
    async function loadExploreSection() {
      const expEl = document.getElementById('section-explore');
      expEl.innerHTML = `
        <div class="px-4 pt-4">
          <div class="rounded-3xl p-5 mb-5 bg-gradient-to-r from-emerald-500 via-teal-500 to-sky-500 text-white shadow-lg">
            <h2 class="kids-font text-2xl font-bold">Explore, Stories & Learning</h2>
            <p class="text-xs font-bold text-white/90 mt-0.5">पचतंत्र गोष्टी, विज्ञान प्रयोग आणि जनरल नॉलेज कार्टून्स</p>
          </div>
          <div id="exploreGridTarget">${getSkeletonCards()}</div>
        </div>
      `;
      lucide.createIcons();

      const res = await fetch('/api/videos?q=' + encodeURIComponent('Hindi Moral Stories Panchatantra Kids Learning'));
      const data = await res.json();
      currentFetchedList = data.videos || [];
      document.getElementById('exploreGridTarget').innerHTML = buildYtKidsGrid(currentFetchedList, 'Kids Learning');
      lucide.createIcons();
    }

    // Boot Initial Shows Feed
    loadLiveCartoons('all', false);
  </script>

  <!-- PART 4: YOUTUBE KIDS PRO IN-APP PLAYER + CHILD LOCK -->
  <div id="kidsPlayerModal" class="fixed inset-0 z-50 bg-[#F4F7FC] hidden flex flex-col">
    <!-- Bright YouTube Kids Player Header -->
    <div id="kidsPlayerHeader" class="bg-white px-4 py-3 flex items-center justify-between shadow-sm border-b border-slate-100">
      <button onclick="exitKidsPlayer()" class="w-10 h-10 rounded-full bg-red-500 text-white flex items-center justify-center shadow-md shadow-red-500/30 active:scale-90 transition">
        <i data-lucide="arrow-left" class="w-6 h-6"></i>
      </button>

      <div class="flex items-center gap-2">
        <span id="playerBadgeLabel" class="px-3 py-1 rounded-full bg-sky-100 text-sky-700 kids-font text-xs font-bold uppercase">
          CARTOON SHOW
        </span>
      </div>

      <!-- Child Touch Lock Button -->
      <button onclick="activateKidsLock()" class="px-3.5 py-2 rounded-full bg-amber-400 text-slate-950 kids-font text-xs font-bold flex items-center gap-1.5 shadow-sm active:scale-95 transition">
        <i data-lucide="lock" class="w-4 h-4"></i>
        <span>Screen Lock</span>
      </button>
    </div>

    <!-- Video Screen Wrapper -->
    <div class="relative w-full max-w-4xl mx-auto aspect-video bg-black shadow-xl">
      <div id="ytKidsIframeTarget" class="w-full h-full"></div>

      <!-- Silent Auto-Skip Toast (No Ugly Browser Alert Box!) -->
      <div id="autoSkipToast" class="hidden absolute bottom-3 left-3 right-3 z-20 bg-slate-900/90 text-white px-4 py-2 rounded-2xl text-xs font-bold flex items-center justify-between">
        <span>Loading next playable cartoon episode...</span>
        <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-amber-400"></i>
      </div>

      <!-- Child Lock Shield Overlay -->
      <div id="kidsTouchShield" class="hidden absolute inset-0 z-30 bg-transparent flex items-start justify-end p-3">
        <button onclick="handleUnlockTap()" class="px-3.5 py-2 rounded-full bg-red-600 text-white kids-font text-xs font-bold shadow-lg flex items-center gap-1.5 animate-bounce">
          <i data-lucide="unlock" class="w-4 h-4"></i>
          <span id="unlockHintText">Tap 3x to Unlock</span>
        </button>
      </div>
    </div>

    <!-- Playing Title & Up Next Safe Kids Videos -->

    let activePlayingCategory = 'Cartoons';
    let screenLockedState = false;
    let tapUnlockCounter = 0;
    let tapResetTimer = null;

    function launchKidsPlayer(ytId, title, categoryLabel) {
      playPop();
      activePlayingId = ytId;
      activePlayingCategory = categoryLabel || 'Cartoons';

      const modal = document.getElementById('kidsPlayerModal');
      modal.classList.remove('hidden');
      document.getElementById('activeCartoonTitle').innerText = title;
      document.getElementById('playerBadgeLabel').innerText = activePlayingCategory;
      document.getElementById('autoSkipToast').classList.add('hidden');

      const target = document.getElementById('ytKidsIframeTarget');
      if (target) {
        target.innerHTML = '<iframe id="directYtFrame" referrerpolicy="no-referrer" src="https://www.youtube.com/embed/' + encodeURIComponent(ytId) + '?autoplay=1&rel=0&playsinline=1&fs=1" style="width:100%;height:100%;border:0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>';
      }

      renderWatchNextList(ytId);
      lucide.createIcons();
    }

    function playNextAvailableCartoon() {
      if (!currentFetchedList || currentFetchedList.length === 0) return;
      const idx = currentFetchedList.findIndex(item => item.ytId === activePlayingId);
      const nextIdx = (idx + 1) % currentFetchedList.length;
      const nextItem = currentFetchedList[nextIdx];
      if (nextItem && nextItem.ytId !== activePlayingId) {
        launchKidsPlayer(nextItem.ytId, nextItem.title, activePlayingCategory);
      }
    }

    function exitKidsPlayer() {
      if (screenLockedState) return;
      playPop();
      const tStop = document.getElementById('ytKidsIframeTarget');
      if (tStop) tStop.innerHTML = '';
      document.getElementById('kidsPlayerModal').classList.add('hidden');
    }

    function activateKidsLock() {
      playPop();
      screenLockedState = true;
      tapUnlockCounter = 0;
      document.getElementById('kidsTouchShield').classList.remove('hidden');
      document.getElementById('kidsPlayerHeader').classList.add('opacity-25', 'pointer-events-none');
      document.getElementById('kidsPlayerBottomArea').classList.add('opacity-25', 'pointer-events-none');
    }

    function handleUnlockTap() {
      tapUnlockCounter++;
      clearTimeout(tapResetTimer);
      tapResetTimer = setTimeout(() => {
        tapUnlockCounter = 0;
        document.getElementById('unlockHintText').innerText = 'Tap 3x to Unlock';
      }, 1300);

      if (tapUnlockCounter < 3) {
        document.getElementById('unlockHintText').innerText = `Tap ${3 - tapUnlockCounter} more times`;
      } else {
        playPop();
        screenLockedState = false;
        tapUnlockCounter = 0;
        document.getElementById('unlockHintText').innerText = 'Tap 3x to Unlock';
        document.getElementById('kidsTouchShield').classList.add('hidden');
        document.getElementById('kidsPlayerHeader').classList.remove('opacity-25', 'pointer-events-none');
        document.getElementById('kidsPlayerBottomArea').classList.remove('opacity-25', 'pointer-events-none');
      }
    }

    function renderWatchNextList(currentId) {
      const target = document.getElementById('upNextKidsGrid');
      const items = (currentFetchedList || []).filter(v => v.ytId !== currentId).slice(0, 10);

      target.innerHTML = items.map(v => `

        </div>

  <script>
    let isParentVerified = false;
    let num1 = 0, num2 = 0;
    let kidsTimerRef = null;
    let secondsLeft = 0;
    let isKidsSearchAllowed = true;

    function makeParentMath() {
      num1 = Math.floor(Math.random() * 14) + 6;
      num2 = Math.floor(Math.random() * 12) + 5;
      return `${num1} + ${num2} = ?`;
    }

    function renderParentsZone() {
      const pEl = document.getElementById('section-parents');

      if (!isParentVerified) {
        const question = makeParentMath();
        pEl.innerHTML = `
          <div class="px-4 pt-6 flex justify-center">
            <div class="yt-card p-6 w-full max-w-md text-center">
              <div class="w-16 h-16 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center mx-auto mb-3">
                <i data-lucide="shield-check" class="w-9 h-9"></i>
              </div>
              <h2 class="kids-font text-2xl font-bold text-slate-900">Grown-Ups Only</h2>
              <p class="text-xs font-bold text-slate-500 mt-1">सेटिंग्ज बदलण्यासाठी खालील गणित सोडवा:</p>

              <div class="my-5 py-3.5 rounded-2xl bg-slate-100 border-2 border-slate-200">
                <span class="kids-font text-2xl font-bold text-red-600">${question}</span>
              </div>

              <input type="number" id="parentMathField" placeholder="येथे उत्तर लिहा..." class="w-full bg-slate-50 border-2 border-sky-300 rounded-2xl py-3 px-4 text-center font-extrabold text-slate-900 text-lg focus:outline-none focus:border-red-500" />

              <button onclick="verifyParentAccess()" class="w-full mt-4 py-3 rounded-2xl bg-red-600 text-white kids-font font-bold text-base shadow-lg shadow-red-500/30 active:scale-95 transition">
                Enter Settings
              </button>
            </div>
          </div>
        `;
      } else {
        pEl.innerHTML = `
          <div class="px-4 pt-4 max-w-2xl mx-auto space-y-4">
            <div class="yt-card p-4 flex items-center justify-between">
              <div>
                <h2 class="kids-font text-xl font-bold text-slate-900">Parents Controls</h2>
                <p class="text-xs font-bold text-slate-500">YouTube Kids सुरक्षा व वेळ नियंत्रण</p>
              </div>
              <button onclick="exitParentAccess()" class="px-3.5 py-2 rounded-xl bg-rose-100 text-rose-700 kids-font text-xs font-bold active:scale-95">
                Lock Settings
              </button>
            </div>

            <!-- Screen Time Limit Timer -->
            <div class="yt-card p-5">
              <div class="flex items-center gap-2 mb-2">
                <i data-lucide="clock" class="w-5 h-5 text-amber-500"></i>
                <h3 class="kids-font text-lg font-bold text-slate-800">Screen Time Timer</h3>
              </div>
              <p class="text-xs font-bold text-slate-500 mb-3">वेळ संपताच ॲप आपोआप लॉक होईल:</p>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                <button onclick="setKidsTimer(15)" class="py-2.5 rounded-xl bg-sky-100 text-sky-800 kids-font text-xs font-bold active:scale-95">15 Mins</button>
                <button onclick="setKidsTimer(30)" class="py-2.5 rounded-xl bg-sky-100 text-sky-800 kids-font text-xs font-bold active:scale-95">30 Mins</button>
                <button onclick="setKidsTimer(45)" class="py-2.5 rounded-xl bg-sky-100 text-sky-800 kids-font text-xs font-bold active:scale-95">45 Mins</button>
                <button onclick="clearKidsTimer()" class="py-2.5 rounded-xl bg-rose-100 text-rose-700 kids-font text-xs font-bold active:scale-95">Off Timer</button>
              </div>
            </div>

            <!-- Search Enable / Disable Toggle (Just like YouTube Kids) -->
            <div class="yt-card p-5 flex items-center justify-between">
              <div>
                <h3 class="kids-font text-base font-bold text-slate-800">Allow Kids Search</h3>
                <p class="text-xs font-bold text-slate-500">बंद केल्यास मुले फक्त होम स्क्रीनवरील कार्टून्स पाहू शकतील</p>
              </div>
              <button onclick="toggleSearchPermission()" class="px-4 py-2 rounded-xl ${isKidsSearchAllowed ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-700'} kids-font text-xs font-bold active:scale-95">
                ${isKidsSearchAllowed ? 'Search: ON' : 'Search: OFF'}
              </button>
            </div>
          </div>
        `;
      }
      lucide.createIcons();
    }

    function verifyParentAccess() {
      const val = parseInt(document.getElementById('parentMathField').value);
      if (val === (num1 + num2)) {
        playPop();
        isParentVerified = true;
        renderParentsZone();
      } else {
        document.getElementById('parentMathField').value = '';
        document.getElementById('parentMathField').placeholder = 'चुकीचे उत्तर! पुन्हा टाका';
      }
    }

    function exitParentAccess() {
      playPop();
      isParentVerified = false;
      renderParentsZone();
    }

    function toggleSearchPermission() {
      playPop();
      isKidsSearchAllowed = !isKidsSearchAllowed;
      const searchBtn = document.querySelector('header button[onclick*="toggleSearchDrawer"]');
      if (searchBtn) {
        searchBtn.style.display = isKidsSearchAllowed ? 'flex' : 'none';
      }
      if (!isKidsSearchAllowed) {
        document.getElementById('searchDrawer').classList.add('hidden');
      }
      renderParentsZone();
    }

    function setKidsTimer(mins) {
      playPop();
      clearInterval(kidsTimerRef);
      secondsLeft = mins * 60;
      const badge = document.getElementById('timerBadge');
      badge.classList.remove('hidden');
      refreshTimerLabel();

      kidsTimerRef = setInterval(() => {
        secondsLeft--;
        refreshTimerLabel();
        if (secondsLeft <= 0) {
          clearInterval(kidsTimerRef);
          badge.classList.add('hidden');
          showTimeUpScreen();
        }
      }, 1000);
    }

    function clearKidsTimer() {
      playPop();
      clearInterval(kidsTimerRef);
      document.getElementById('timerBadge').classList.add('hidden');
    }

    function refreshTimerLabel() {
      const m = Math.floor(secondsLeft / 60);
      const s = secondsLeft % 60;
      document.getElementById('timerDisplay').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function showTimeUpScreen() {
      screenLockedState = false;
      exitKidsPlayer();
      document.getElementById('ytLockMathQ').innerText = makeParentMath();
      document.getElementById('ytTimeUpOverlay').classList.remove('hidden');
      lucide.createIcons();
    }

    function unlockTimeUpScreen() {
      const val = parseInt(document.getElementById('ytLockMathAns').value);
      if (val === (num1 + num2)) {
        playPop();
        document.getElementById('ytTimeUpOverlay').classList.add('hidden');
        document.getElementById('ytLockMathAns').value = '';
      } else {
        document.getElementById('ytLockMathAns').value = '';
        document.getElementById('ytLockMathAns').placeholder = 'पुन्हा प्रयत्न करा!';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>

    // Play Magic Star Chime Sound
    function playStarChime() {
      if (popCtx.state === 'suspended') popCtx.resume();
      [660, 880, 1120].forEach((freq, i) => {
        const osc = popCtx.createOscillator();
        const gain = popCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, popCtx.currentTime + i * 0.06);
        gain.gain.setValueAtTime(0.1, popCtx.currentTime + i * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, popCtx.currentTime + i * 0.06 + 0.14);
        osc.connect(gain);
        gain.connect(popCtx.destination);
        osc.start(popCtx.currentTime + i * 0.06);
        osc.stop(popCtx.currentTime + i * 0.06 + 0.15);
      });
    }

        playPop();
        favCartoons.splice(idx, 1);
      } else {
        playStarChime();
        favCartoons.unshift({ ytId, title, badgeText, duration: 'FAV' });
      }
      localStorage.setItem('kidsToneFavs', JSON.stringify(favCartoons));
      document.querySelectorAll(`.fav-heart-${ytId}`).forEach(icon => {
        if (idx > -1) {
          icon.classList.remove('text-rose-500', 'fill-rose-500');
          icon.classList.add('text-white');

              `;
            }).join('')}

          <div class="flex items-center justify-between mb-3">

          <div id="infiniteCardsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">

          <div id="infiniteLoaderBar" class="py-8 text-center">
            <button onclick="appendMoreEpisodes()" class="px-6 py-3 rounded-full bg-red-600 text-white kids-font text-sm font-bold shadow-lg shadow-red-500/30 active:scale-95 transition">
              Load More Episodes
            </button>
          </div>
        </div>
      `;
      lucide.createIcons();
      await appendMoreEpisodes(true);

      // Automatically save the real fetched cartoon image into that character's bubble!
      if (!isCustomQuery && currentFetchedList.length > 0 && selectedShow !== 'all') {
        const liveImgUrl = `https://i.ytimg.com/vi/${currentFetchedList[0].ytId}/mqdefault.jpg`;
        if (savedBubbleThumbs[selectedShow] !== liveImgUrl) {
          savedBubbleThumbs[selectedShow] = liveImgUrl;
          localStorage.setItem('kidsToneBubbleThumbs', JSON.stringify(savedBubbleThumbs));
        }
      }
    };

    // Start cleanly on All Shows
    selectedShow = 'all';
    loadLiveCartoons('all', false);

        micBtn.innerHTML = `<i data-lucide="mic" class="w-4 h-4"></i>`;
        searchForm.insertBefore(micBtn, searchForm.lastElementChild);
      }

      // Add "Draw & Paint" and "Kids Piano" Tabs to Navigation Bar
      const tabsBar = document.querySelector('header .overflow-x-auto');

      if (tabsBar && !document.getElementById('drawTabBtn')) {
        const drawBtn = document.createElement('button');
        drawBtn.id = 'drawTabBtn';
        drawBtn.className = 'main-tab bg-slate-100 text-slate-600 px-4 py-2 rounded-full kids-font text-sm font-semibold flex items-center gap-1.5 shrink-0 transition';
        drawBtn.innerHTML = `<i data-lucide="palette" class="w-4 h-4 text-purple-500"></i><span>Draw & Color</span>`;
        drawBtn.onclick = function() { switchMainSection('draw', drawBtn); };
        tabsBar.insertBefore(drawBtn, tabsBar.lastElementChild);

        const drawSec = document.createElement('section');
        drawSec.id = 'section-draw';
        drawSec.className = 'content-section hidden';

    function toggleKidsNightMode() {
      playPop();
      document.body.classList.toggle('night-mode');
      const isNight = document.body.classList.contains('night-mode');
      const btn = document.getElementById('nightModeBtn');
      if (btn) {
        btn.innerHTML = isNight
          ? `<i data-lucide="sun" class="w-4 h-4 text-amber-400"></i>`

        lucide.createIcons();

    // 2. Magic Surprise Random Cartoon Feature!
    function playMagicSurpriseCartoon() {
      playStarChime();
      if (currentFetchedList && currentFetchedList.length > 0) {
        const randomVid = currentFetchedList[Math.floor(Math.random() * currentFetchedList.length)];
        launchKidsPlayer(randomVid.ytId, randomVid.title, 'Magic Surprise');
      } else {
        selectShowCharacter('motu');
      }
    }

    // 3. Kids Voice Search (Speak to Search Cartoons)
    function startKidsVoiceSearch() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        alert('तुमच्या ब्राउझरमध्ये Voice Search उपलब्ध नाही. कृपया नाव टाईप करा!');
        return;
      }
      playPop();
      const recognition = new SpeechRec();
      recognition.lang = 'hi-IN';
      const inputEl = document.getElementById('liveSearchInput');
      inputEl.placeholder = 'बोला... (उदा. Motu Patlu, Chhota Bheem)...';

      recognition.onresult = function(event) {
        const spokenText = event.results[0][0].transcript;
        inputEl.value = spokenText;
        const firstTab = document.querySelector('.main-tab');
        switchMainSection('shows', firstTab);
        loadLiveCartoons(spokenText, true);
      };
      recognition.start();
    }

    // 4. Interactive Kids Drawing & Coloring Canvas
    let brushColor = '#FF0033';
    let brushSize = 8;
    let isDrawingNow = false;

    function renderDrawingPad() {
      const dEl = document.getElementById('section-draw');
      const paletteColors = ['#FF0033', '#FF8A00', '#FFD600', '#00C853', '#00A8FF', '#7C3AED', '#EC4899', '#1E293B', '#FFFFFF'];

      dEl.innerHTML = `
        <div class="px-4 pt-4 max-w-2xl mx-auto">
          <div class="yt-card p-4">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h2 class="kids-font text-xl font-bold text-slate-900">Magic Drawing Pad</h2>
                <p class="text-xs font-bold text-slate-500">बोटाने सुंदर चित्र काढा आणि रंग भरा!</p>
              </div>
              <div class="flex gap-2">
                <button onclick="clearKidsCanvas()" class="px-3 py-1.5 rounded-xl bg-rose-100 text-rose-700 kids-font text-xs font-bold active:scale-95">Clear</button>
                <button onclick="saveKidsDrawing()" class="px-3 py-1.5 rounded-xl bg-emerald-500 text-white kids-font text-xs font-bold shadow active:scale-95">Save Art</button>
              </div>
            </div>

            <!-- Color Palette -->
            <div class="flex items-center justify-between gap-1.5 overflow-x-auto no-scrollbar pb-3">
              ${paletteColors.map(col => `
                <button onclick="setBrushColor('${col}')" style="background:${col}" class="w-8 h-8 rounded-full border-2 border-slate-300 shrink-0 shadow-sm active:scale-90 transition"></button>
              `).join('')}
            </div>

            <!-- Touch Drawing Canvas -->
            <div class="rounded-2xl overflow-hidden border-2 border-sky-200 bg-white touch-none">
              <canvas id="kidsArtCanvas" class="w-full h-[52vh] block cursor-crosshair"></canvas>
            </div>
          </div>
        </div>
      `;

      const canvas = document.getElementById('kidsArtCanvas');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function startDraw(e) {
        isDrawingNow = true;
        const pos = getCoords(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }
      function moveDraw(e) {
        if (!isDrawingNow) return;
        e.preventDefault();
        const pos = getCoords(e);
        ctx.strokeStyle = brushColor;
        ctx.lineWidth = brushColor === '#FFFFFF' ? 22 : brushSize;
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }
      function endDraw() { isDrawingNow = false; }

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', endDraw);
      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      canvas.addEventListener('touchend', endDraw);
    }

    function setBrushColor(c) {
      playPop();
      brushColor = c;
    }

    function clearKidsCanvas() {
      playPop();
      const canvas = document.getElementById('kidsArtCanvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function saveKidsDrawing() {
      playStarChime();
      const canvas = document.getElementById('kidsArtCanvas');
      const link = document.createElement('a');
      link.download = 'KidsTone_Drawing.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    // 5. Rainbow Musical Kids Piano (Sa Re Ga Ma Pa Dha Ni Sa)
    function renderKidsPiano() {
      const pEl = document.getElementById('section-piano');
      const notes = [
        { name: 'SA', freq: 261.63, color: 'from-red-500 to-rose-600' },
        { name: 'RE', freq: 293.66, color: 'from-orange-400 to-amber-600' },
        { name: 'GA', freq: 329.63, color: 'from-yellow-400 to-amber-500' },
        { name: 'MA', freq: 349.23, color: 'from-emerald-400 to-green-600' },
        { name: 'PA', freq: 392.00, color: 'from-cyan-400 to-sky-600' },
        { name: 'DHA', freq: 440.00, color: 'from-blue-500 to-indigo-600' },
        { name: 'NI', freq: 493.88, color: 'from-purple-500 to-violet-700' },
        { name: 'SA+', freq: 523.25, color: 'from-pink-500 to-rose-600' }
      ];

      pEl.innerHTML = `
        <div class="px-4 pt-4 max-w-2xl mx-auto">
          <div class="yt-card p-5 text-center">
            <h2 class="kids-font text-2xl font-bold text-slate-900">Rainbow Magic Piano</h2>
            <p class="text-xs font-bold text-slate-500 mt-0.5 mb-5">रंगीबेरंगी बटने दाबून स्वतःचे संगीत बनवा!</p>

            <div class="grid grid-cols-4 sm:grid-cols-8 gap-2.5 h-60">
              ${notes.map(n => `
                <button onclick="playPianoTone(${n.freq})" class="rounded-2xl bg-gradient-to-b ${n.color} text-white kids-font font-bold text-lg flex flex-col items-center justify-end pb-4 shadow-lg active:scale-95 transition">
                  <span>${n.name}</span>
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function playPianoTone(freq) {
      if (popCtx.state === 'suspended') popCtx.resume();
      const osc = popCtx.createOscillator();
      const gain = popCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, popCtx.currentTime);
      gain.gain.setValueAtTime(0.22, popCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, popCtx.currentTime + 0.45);
      osc.connect(gain);
      gain.connect(popCtx.destination);
      osc.start();
      osc.stop(popCtx.currentTime + 0.46);
    }

    // Hook switchMainSection for Draw & Piano Tabs
    const prevSwitchV5 = switchMainSection;
    switchMainSection = function(secName, btn) {
      prevSwitchV5(secName, btn);
      if (secName === 'draw') renderDrawingPad();
      if (secName === 'piano') renderKidsPiano();
    };

    lucide.createIcons();
  </script>
