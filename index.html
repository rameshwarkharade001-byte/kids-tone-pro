<body>

  <!-- PART 2 CORE SCRIPT: Audio, Age Profiles & Navigation -->
  <script>
    lucide.createIcons();

    // Playful Bubble Pop Sound (Web Audio API)
    const popCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playPop() {
      if (popCtx.state === 'suspended') popCtx.resume();
      const osc = popCtx.createOscillator();
      const gain = popCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(580, popCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(980, popCtx.currentTime + 0.07);
      gain.gain.setValueAtTime(0.1, popCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, popCtx.currentTime + 0.07);
      osc.connect(gain);
      gain.connect(popCtx.destination);
      osc.start();
      osc.stop(popCtx.currentTime + 0.08);
    }

    // Age Profiles (Just like YouTube Kids: Preschool, Younger, Older)
    const ageModes = [
      { id: 'all', label: 'All Ages', queryBoost: '' },
      { id: 'preschool', label: 'Preschool (2-4)', queryBoost: 'nursery rhymes chiki chum' },
      { id: 'younger', label: 'Younger (5-8)', queryBoost: 'motu patlu chhota bheem oggy' },
      { id: 'older', label: 'Older (9-12)', queryBoost: 'vir robot boy gattu battu taarak mehta' }
    ];
    let currentAgeIdx = 0;

    function cycleAgeProfile() {
      playPop();
      currentAgeIdx = (currentAgeIdx + 1) % ageModes.length;
      const mode = ageModes[currentAgeIdx];
      document.getElementById('ageLabel').innerText = mode.label;
      if (typeof loadLiveCartoons === 'function') {
        loadLiveCartoons(mode.id === 'all' ? 'all' : mode.queryBoost, mode.id !== 'all');
      }
    }

    function toggleSearchDrawer() {
      const drawer = document.getElementById('searchDrawer');
      drawer.classList.toggle('hidden');
      if (!drawer.classList.contains('hidden')) {
        document.getElementById('liveSearchInput').focus();
      }
    }

    function switchMainSection(secName, btn) {
      playPop();
      document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
      document.getElementById('section-' + secName).classList.remove('hidden');

      document.querySelectorAll('.main-tab').forEach(t => {
        t.classList.remove('tab-pill-active');
        t.classList.add('bg-slate-100', 'text-slate-600');
      });
      btn.classList.add('tab-pill-active');
      btn.classList.remove('bg-slate-100', 'text-slate-600');

      if (secName === 'music' && typeof loadMusicSection === 'function') loadMusicSection();
      if (secName === 'explore' && typeof loadExploreSection === 'function') loadExploreSection();
      if (secName === 'parents' && typeof renderParentsZone === 'function') renderParentsZone();
    }

    function resetToHome() {
      playPop();
      const firstTab = document.querySelector('.main-tab');
      switchMainSection('shows', firstTab);
      if (typeof selectShowCharacter === 'function') selectShowCharacter('all');
    }
  </script>

  <!-- PART 3: LIVE YOUTUBE KIDS SERVER FEED & CHARACTER ENGINE -->
  <script>
    const showsCharacters = [
      { id: 'all', name: 'All Shows', bg: 'from-red-500 to-amber-500', code: 'ALL' },
      { id: 'motu', name: 'Motu Patlu', bg: 'from-amber-400 to-orange-600', code: 'MP' },
      { id: 'bheem', name: 'Chhota Bheem', bg: 'from-orange-500 to-red-600', code: 'CB' },
      { id: 'oggy', name: 'Oggy', bg: 'from-sky-400 to-blue-600', code: 'OG' },
      { id: 'vir', name: 'Vir Robot Boy', bg: 'from-rose-500 to-pink-600', code: 'VR' },
      { id: 'gattu', name: 'Gattu Battu', bg: 'from-emerald-400 to-teal-600', code: 'GB' },
      { id: 'pakdam', name: 'Pakdam Pakdai', bg: 'from-purple-500 to-indigo-600', code: 'PP' },
      { id: 'shinchan', name: 'Shinchan', bg: 'from-red-500 to-yellow-500', code: 'SC' },
      { id: 'taarak', name: 'Taarak Mehta', bg: 'from-yellow-400 to-amber-600', code: 'TM' }
    ];

    let selectedShow = 'all';
    let currentFetchedList = [];

    // Render Loading Skeletons while Server Fetches Live YouTube Videos
    function getSkeletonCards() {
      return Array(6).fill(0).map(() => `
        <div class="yt-card overflow-hidden p-2.5">
          <div class="w-full aspect-video rounded-2xl skeleton-pulse"></div>
          <div class="h-4 w-3/4 rounded-lg skeleton-pulse mt-3"></div>
          <div class="h-3 w-1/3 rounded-lg skeleton-pulse mt-2"></div>
        </div>
      `).join('');
    }

    // Build Video Cards Grid (Official YouTube Kids Style)
    function buildYtKidsGrid(videos, badgeText) {
      if (!videos || videos.length === 0) {
        return `<div class="yt-card p-8 text-center text-slate-500 font-bold">व्हिडिओ लोड होत आहेत किंवा इंटरनेट तपासा...</div>`;
      }

      return `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
          ${videos.map(v => `
            <div onclick="launchKidsPlayer('${v.ytId}', '${v.title.replace(/'/g, "\\'")}', '${badgeText}')" class="yt-card overflow-hidden cursor-pointer group">
              <div class="relative aspect-video bg-slate-200 overflow-hidden">
                <img 
                  src="https://i.ytimg.com/vi/${v.ytid}/mqdefault.jpg" 
                  alt="${v.title}" 
                  class="w-full h-full object-cover group-hover:scale-105 transition duration-300" 
                  loading="lazy"
                />
                <span class="absolute bottom-2.5 right-2.5 bg-slate-900/85 text-white text-[11px] font-extrabold px-2.5 py-0.5 rounded-lg">
                  ${v.duration || 'HD'}
                </span>
                <div class="absolute inset-0 flex items-center justify-center bg-black/10 group-hover:bg-black/20 transition">
                  <div class="w-14 h-14 rounded-full bg-red-600/95 flex items-center justify-center shadow-xl border-2 border-white">
                    <i data-lucide="play" class="w-7 h-7 text-white fill-white ml-0.5"></i>
                  </div>
                </div>
              </div>
              <div class="p-3.5">
                <div class="flex items-center gap-1.5 mb-1">
                  <span class="px-2 py-0.5 rounded-md bg-sky-100 text-sky-700 text-[10px] font-extrabold uppercase tracking-wide">
                    ${badgeText}
                  </span>
                  <span class="text-[10px] font-bold text-emerald-600 flex items-center gap-0.5">
                    <i data-lucide="check-circle-2" class="w-3 h-3"></i> Kids Safe
                  </span>
                </div>
                <h3 class="kids-font text-base font-semibold text-slate-800 line-clamp-2 leading-snug">
                  ${v.title}
                </h3>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // Fetch Live Videos from Python Flask Server (/api/videos)
    async function loadLiveCartoons(param, isCustomQuery = false) {
      const showsEl = document.getElementById('section-shows');

      // Render Character Bubbles Row
      let bubblesHtml = `
        <div class="px-4 pt-4">
          <div class="flex gap-3.5 overflow-x-auto no-scrollbar pb-2">
            ${showsCharacters.map(c => {
              const active = !isCustomQuery && selectedShow === c.id;
              return `
                <button onclick="selectShowCharacter('${c.id}')" class="flex flex-col items-center shrink-0 active:scale-90 transition">
                  <div class="w-16 h-16 rounded-full p-1 bg-gradient-to-tr ${c.bg} ${active ? 'ring-4 ring-red-500 scale-105' : 'opacity-90'} shadow-md">
                    <div class="w-full h-full rounded-full bg-white flex items-center justify-center">
                      <span class="kids-font font-bold text-lg bg-gradient-to-tr ${c.bg} bg-clip-text text-transparent">${c.code}</span>
                    </div>
                  </div>
                  <span class="text-xs mt-1.5 font-extrabold ${active ? 'text-red-600' : 'text-slate-600'}">${c.name}</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;

      const headingTitle = isCustomQuery
        ? `Results for "${param}"`
        : (showsCharacters.find(x => x.id === selectedShow)?.name || 'All Cartoon Shows');

      showsEl.innerHTML = bubblesHtml + `
        <div class="px-4 pt-3">
          <div class="flex items-center justify-between mb-3">
            <h2 class="kids-font text-xl font-bold text-slate-800">${headingTitle}</h2>
            <span class="text-xs font-extrabold text-sky-600 bg-sky-100 px-3 py-1 rounded-full">Live YouTube Kids</span>
          </div>
          <div id="showsGridTarget">${getSkeletonCards()}</div>
        </div>
      `;
      lucide.createIcons();

      try {
        const apiUrl = isCustomQuery
          ? `/api/videos?q=${encodeURIComponent(param)}`
          : `/api/videos?category=${encodeURIComponent(param)}`;
        const res = await fetch(apiUrl);
        const data = await res.json();
        currentFetchedList = data.videos || [];
        document.getElementById('showsGridTarget').innerHTML = buildYtKidsGrid(
          currentFetchedList,
          isCustomQuery ? 'Kids Search' : headingTitle
        );
        lucide.createIcons();
      } catch (err) {
        document.getElementById('showsGridTarget').innerHTML = `
          <div class="yt-card p-6 text-center text-rose-600 font-bold">
            सर्व्हर कनेक्ट होत आहे... कृपया <code>python server.py</code> चालू असल्याची खात्री करा.
          </div>
        `;
      }
    }

    function selectShowCharacter(catId) {
      playPop();
      selectedShow = catId;
      loadLiveCartoons(catId, false);
    }

    function handleLiveSearch(e) {
      e.preventDefault();
      const q = document.getElementById('liveSearchInput').value.trim();
      if (!q) return;
      playPop();
      const firstTab = document.querySelector('.main-tab');
      switchMainSection('shows', firstTab);
      loadLiveCartoons(q, true);
    }

    // Load Music & Rhymes Tab (Chiki Chum, ChuChu TV, Hindi Nursery Rhymes)
    async function loadMusicSection() {
      const musicEl = document.getElementById('section-music');
      musicEl.innerHTML = `
        <div class="px-4 pt-4">
          <div class="rounded-3xl p-5 mb-5 bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 text-white shadow-lg">
            <h2 class="kids-font text-2xl font-bold">Chiki Chum & Kids Rhymes</h2>
            <p class="text-xs font-bold text-white/90 mt-0.5">लहान मुलांसाठी बडबडगीते, ABC गाणी आणि डान्स व्हिडिओ</p>
          </div>
          <div id="musicGridTarget">${getSkeletonCards()}</div>
        </div>
      `;
      lucide.createIcons();

      const res = await fetch('/api/videos?category=rhymes');
      const data = await res.json();
      currentFetchedList = data.videos || [];
      document.getElementById('musicGridTarget').innerHTML = buildYtKidsGrid(currentFetchedList, 'Kids Rhymes');
      lucide.createIcons();
    }

    // Load Explore & Learn Tab (Moral Stories, Science & Craft for Kids)
    async function loadExploreSection() {
      const expEl = document.getElementById('section-explore');
      expEl.innerHTML = `
        <div class="px-4 pt-4">
          <div class="rounded-3xl p-5 mb-5 bg-gradient-to-r from-emerald-500 via-teal-500 to-sky-500 text-white shadow-lg">
            <h2 class="kids-font text-2xl font-bold">Explore, Stories & Learning</h2>
            <p class="text-xs font-bold text-white/90 mt-0.5">पचतंत्र गोष्टी, विज्ञान प्रयोग आणि जनरल नॉलेज कार्टून्स</p>
          </div>
          <div id="exploreGridTarget">${getSkeletonCards()}</div>
        </div>
      `;
      lucide.createIcons();

      const res = await fetch('/api/videos?q=' + encodeURIComponent('Hindi Moral Stories Panchatantra Kids Learning'));
      const data = await res.json();
      currentFetchedList = data.videos || [];
      document.getElementById('exploreGridTarget').innerHTML = buildYtKidsGrid(currentFetchedList, 'Kids Learning');
      lucide.createIcons();
    }

    // Boot Initial Shows Feed
    loadLiveCartoons('all', false);
  </script>

  <!-- PART 4: YOUTUBE KIDS PRO IN-APP PLAYER + CHILD LOCK -->
  <div id="kidsPlayerModal" class="fixed inset-0 z-50 bg-[#F4F7FC] hidden flex flex-col">
    <!-- Bright YouTube Kids Player Header -->
    <div id="kidsPlayerHeader" class="bg-white px-4 py-3 flex items-center justify-between shadow-sm border-b border-slate-100">
      <button onclick="exitKidsPlayer()" class="w-10 h-10 rounded-full bg-red-500 text-white flex items-center justify-center shadow-md shadow-red-500/30 active:scale-90 transition">
        <i data-lucide="arrow-left" class="w-6 h-6"></i>
      </button>

      <div class="flex items-center gap-2">
        <span id="playerBadgeLabel" class="px-3 py-1 rounded-full bg-sky-100 text-sky-700 kids-font text-xs font-bold uppercase">
          CARTOON SHOW
        </span>
      </div>

      <!-- Child Touch Lock Button -->
      <button onclick="activateKidsLock()" class="px-3.5 py-2 rounded-full bg-amber-400 text-slate-950 kids-font text-xs font-bold flex items-center gap-1.5 shadow-sm active:scale-95 transition">
        <i data-lucide="lock" class="w-4 h-4"></i>
        <span>Screen Lock</span>
      </button>
    </div>

    <!-- Video Screen Wrapper -->
    <div class="relative w-full max-w-4xl mx-auto aspect-video bg-black shadow-xl">

      const m = Math.floor(secondsLeft / 60);

    // Play Magic Star Chime Sound
    function playStarChime() {
      if (popCtx.state === 'suspended') popCtx.resume();
      [660, 880, 1120].forEach((freq, i) => {
        const osc = popCtx.createOscillator();
        const gain = popCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, popCtx.currentTime + i * 0.06);
        gain.gain.setValueAtTime(0.1, popCtx.currentTime + i * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, popCtx.currentTime + i * 0.06 + 0.14);
        osc.connect(gain);
        gain.connect(popCtx.destination);
        osc.start(popCtx.currentTime + i * 0.06);
        osc.stop(popCtx.currentTime + i * 0.06 + 0.15);
      });
    }

    function renderDrawingPad() {
      const dEl = document.getElementById('section-draw');
      const paletteColors = ['#FF0033', '#FF8A00', '#FFD600', '#00C853', '#00A8FF', '#7C3AED', '#EC4899', '#1E293B', '#FFFFFF'];

        </div>
      `;

      const canvas = document.getElementById('kidsArtCanvas');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function startDraw(e) {
        isDrawingNow = true;
        const pos = getCoords(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }
      function moveDraw(e) {
        if (!isDrawingNow) return;
        e.preventDefault();
        const pos = getCoords(e);
        ctx.strokeStyle = brushColor;
        ctx.lineWidth = brushColor === '#FFFFFF' ? 22 : brushSize;
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }
      function endDraw() { isDrawingNow = false; }

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', endDraw);
      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      canvas.addEventListener('touchend', endDraw);
    }

    function setBrushColor(c) {
      playPop();
      brushColor = c;
    }

    function clearKidsCanvas() {
      playPop();
      const canvas = document.getElementById('kidsArtCanvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';

        { name: 'MA', freq: 349.23, color: 'from-emerald-400 to-green-600' },
        { name: 'PA', freq: 392.00, color: 'from-cyan-400 to-sky-600' },
        { name: 'DHA', freq: 440.00, color: 'from-blue-500 to-indigo-600' },
        { name: 'NI', freq: 493.88, color: 'from-purple-500 to-violet-700' },
        { name: 'SA+', freq: 523.25, color: 'from-pink-500 to-rose-600' }
      ];

      pEl.innerHTML = `
        <div class="px-4 pt-4 max-w-2xl mx-auto">
          <div class="yt-card p-5 text-center">
            <h2 class="kids-font text-2xl font-bold text-slate-900">Rainbow Magic Piano</h2>
            <p class="text-xs font-bold text-slate-500 mt-0.5 mb-5">रंगीबेरंगी बटने दाबून स्वतःचे संगीत बनवा!</p>

            <div class="grid grid-cols-4 sm:grid-cols-8 gap-2.5 h-60">
              ${notes.map(n => `
                <button onclick="playPianoTone(${n.freq})" class="rounded-2xl bg-gradient-to-b ${n.color} text-white kids-font font-bold text-lg flex flex-col items-center justify-end pb-4 shadow-lg active:scale-95 transition">
                  <span>${n.name}</span>
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function playPianoTone(freq) {
      if (popCtx.state === 'suspended') popCtx.resume();
      const osc = popCtx.createOscillator();
      const gain = popCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, popCtx.currentTime);
      gain.gain.setValueAtTime(0.22, popCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, popCtx.currentTime + 0.45);
      osc.connect(gain);
      gain.connect(popCtx.destination);
      osc.start();
      osc.stop(popCtx.currentTime + 0.46);
    }

    // Hook switchMainSection for Draw & Piano Tabs
    const prevSwitchV5 = switchMainSection;
    switchMainSection = function(secName, btn) {
      prevSwitchV5(secName, btn);
      if (secName === 'draw') renderDrawingPad();
      if (secName === 'piano') renderKidsPiano();

(function() {

  const baseQueries = {
    all: ["motu patlu chhota bheem doraemon hindi cartoon", "shinchan oggy rudra hindi cartoon", "hindi cartoon full episodes kids", "indian kids cartoon movie hindi"],

    doraemon: ["doraemon hindi cartoon episodes", "doraemon new episodes hindi", "doraemon movie hindi", "doraemon nobita funny hindi"],
    shinchan: ["shinchan hindi cartoon episodes", "shinchan funny episodes hindi"],
    oggy: ["oggy and the cockroaches hindi episodes", "oggy funny hindi cartoon"]
  };

  async function fetchCachedVideos(q, page) {
    const key = q + "::" + page;
    if (apiCache.has(key)) return apiCache.get(key);
    const res = await fetch(`/api/videos?q=${encodeURIComponent(q)}&page=${page}`);
    if (!res.ok) return [];
    const data = await res.json();
    const raw = Array.isArray(data) ? data : (data.videos || data.items || []);
    const clean = raw
      .filter(v => v && (v.ytid || v.videoId || v.id))
      .map(v => ({
        ytid: v.ytid || v.videoId || v.id,
        title: v.title || "Kids Cartoon Episode",
        duration: v.duration || "HD"
      }));
    apiCache.set(key, clean);
    return clean;
  }

  window.appendMoreEpisodes = async function(isFirstLoad = false) {
    if (isFetchingMore && !isFirstLoad) return;
    const grid = document.getElementById("infiniteCardsGrid");
    const badge = document.getElementById("loadedCounterBadge");
    if (!grid) return;

    isFetchingMore = true;
    const param = (typeof activeParam !== "undefined" && activeParam) ? activeParam : "all";
    const isCustom = (typeof activeIsCustom !== "undefined") ? activeIsCustom : false;
    const page = isFirstLoad ? 1 : ((typeof currentPageNum !== "undefined" && currentPageNum) ? currentPageNum : 2);

    if (isFirstLoad) {
      seenIds = new Set();
      if (typeof currentPageNum !== "undefined") currentPageNum = 1;
    }

    const qList = baseQueries[param] || [param + " hindi cartoon episodes", param + " funny cartoon", param + " full movie hindi"];
    const q = isCustom ? (page === 1 ? param : param + " episodes " + page) : qList[(page - 1) % qList.length];

    let videos = [];
    try {
      videos = await fetchCachedVideos(q, page);
    } catch (e) {}

    // Remove duplicates
    const freshVideos = videos.filter(v => {
      if (seenIds.has(v.ytid)) return false;
      seenIds.add(v.ytid);
      return true;
    });

    if (typeof currentFetchedList !== "undefined") {
      currentFetchedList = isFirstLoad ? freshVideos : currentFetchedList.concat(freshVideos);
    }

    const label = (typeof activeBadgeLabel !== "undefined" && activeBadgeLabel) ? activeBadgeLabel : "All Shows";
    const cardsHtml = freshVideos.map(v => {
      const safeTitle = (v.title || "").replace(/'/g, "\'").replace(/"/g, "&quot;");
      return `
        <div onclick="if(typeof launchKidsPlayer==='function') launchKidsPlayer('${v.ytid}','${safeTitle}','${label}');" class="yt-card bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden cursor-pointer">
          <div class="relative aspect-video bg-slate-200">
            <img loading="lazy" src="https://i.ytimg.com/vi/${v.ytid}/hqdefault.jpg" alt="${safeTitle}" class="w-full h-full object-cover">

            <div class="font-bold text-slate-900 text-sm line-clamp-2">${v.title}</div>
          </div>
        </div>`;
    }).join("");

    if (isFirstLoad) grid.innerHTML = cardsHtml || grid.innerHTML;
    else if (cardsHtml) grid.insertAdjacentHTML("beforeend", cardsHtml);

    if (badge) {
      badge.innerText = seenIds.size + "+ Episodes";
    }
    if (typeof currentPageNum !== "undefined") currentPageNum = page + 1;
    isFetchingMore = false;
  };

  // Auto Infinite Scroll like YouTube
  function setupAutoScroll() {
    const loader = document.getElementById("infiniteLoaderBar");
    if (!loader || loader.dataset.observed) return;
    loader.dataset.observed = "1";
    const obs = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !isFetchingMore) {
        appendMoreEpisodes(false);
      }
    }, { rootMargin: "350px" });
    obs.observe(loader);
  }

  // Background prefetch popular shows so switching tabs is instant!
  window.addEventListener("load", () => {
    setInterval(setupAutoScroll, 1000);
    setTimeout(() => {
      ["motu", "bheem", "doraemon"].forEach((k, idx) => {
        setTimeout(() => {
          fetchCachedVideos(baseQueries[k][0], 1).catch(() => {});
        }, (idx + 1) * 900);
      });
    }, 1500);
  });
})();
</script>

<script id="ktUltraFastAndBannerJS">
(function() {
  // 1. Keep character bubbles clean (MP, CB, DR)
  try {
    localStorage.removeItem("kidsToneBubbleThumbs");
    if (typeof savedBubbleThumbs !== "undefined") {
      Object.keys(savedBubbleThumbs).forEach(k => delete savedBubbleThumbs[k]);
    }
  } catch (e) {}

  // 2. Instant LocalStorage API Cache (0ms load on revisit + background refresh)
  const LS_PREFIX = "kt_fast_v3_";
  const origFetch = window.fetch;
  window.fetch = async function(input, init) {
    const url = typeof input === "string" ? input : (input && input.url) || "";
    if (url.includes("/api/videos?")) {
      const cacheKey = LS_PREFIX + url;
      const cached = localStorage.getItem(cacheKey);
      if (cached) {
        origFetch(input, init)
          .then(r => (r.ok ? r.text() : null))
          .then(txt => {
            if (txt && txt.length > 20) {
              try { localStorage.setItem(cacheKey, txt); } catch (e) {}
            }
          })
          .catch(() => {});
        return new Response(cached, {
          status: 200,
          headers: { "Content-Type": "application/json" }
        });
      }
      const res = await origFetch(input, init);
      if (res.ok) {
        res.clone().text().then(txt => {
          if (txt && txt.length > 20) {
            try { localStorage.setItem(cacheKey, txt); } catch (e) {}
          }
        }).catch(() => {});
      }
      return res;
    }
    return origFetch(input, init);
  };

  // 3. Direct APK Download Top Banner (hidden inside WebView / installed app)
  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true ||
    /wv|WebView/i.test(navigator.userAgent);
  const dismissed = sessionStorage.getItem("kt_banner_closed") === "1";

  window.addEventListener("DOMContentLoaded", () => {
    const cleanBubbles = () => {
      document.querySelectorAll('#section-shows button img').forEach(img => {
        const parent = img.parentElement;
        if (parent && parent.className.includes("rounded-full")) {
          const label = img.alt || "MP";
          const code = label.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
          img.replaceWith(Object.assign(document.createElement("span"), {
            className: "font-extrabold text-sm text-orange-600",
            innerText: code || "MP"
          }));
        }
      });
    };
    setInterval(cleanBubbles, 800);

    if (isStandalone || dismissed || document.getElementById("ktInstallBanner")) return;

    const banner = document.createElement("div");
    banner.id = "ktInstallBanner";
    banner.className = "show";
    banner.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;min-width:0;">
        <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#ff0055,#ff7b00);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0;">KT</div>
        <div style="overflow:hidden;">
          <div style="font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Kids Tone PRO App</div>
          <div style="font-size:11px;color:#cbd5e1;">Download the Android APK for a faster experience</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        <a id="ktDirectApkBtn" href="/KidsTonePro.apk" download="KidsTonePro.apk" class="kt-inst-btn">Download APK</a>
        <button id="ktInstallCloseBtn" type="button" class="kt-inst-close" aria-label="Close">✕</button>
      </div>
    `;
    document.body.prepend(banner);

    document.getElementById("ktInstallCloseBtn").onclick = () => {
      banner.classList.remove("show");
      sessionStorage.setItem("kt_banner_closed", "1");
    };

    document.getElementById("ktDirectApkBtn").onclick = () => {
      setTimeout(() => {
        banner.classList.remove("show");
        sessionStorage.setItem("kt_banner_closed", "1");
      }, 600);
    };
  });
})();
</script>

<script>
(function() {
  if (window.RKApp) return; // Native App handles orientation directly
  function getFsEl() {
    return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement;
  }
  function onFsChange() {
    if (getFsEl()) {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(function(){});
      }
    } else {
      if (screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch(e) {}
      }
    }
  }
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);
})();
</script><!-- RK-REMOVE-APK-BANNER -->
<script>
(function() {
  function removeApkBanner() {

    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (el.innerText && el.innerText.indexOf('Download the Android APK') !== -1 && el.innerText.length < 200) {
        el.style.display = 'none';
        el.remove();
      }

  }
  removeApkBanner();
  document.addEventListener('DOMContentLoaded', removeApkBanner);
  setTimeout(removeApkBanner, 500);
})();
